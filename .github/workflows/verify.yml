name: Verify evaluation kit

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m harness_eval audit
      - run: python scripts/verify_public_pilots.py
      - run: python scripts/analyze_evaluation_v2.py --check
      - run: python scripts/verify_contracts_v2.py --check
      - run: python scripts/audit_contract_evidence.py --check
      - run: python scripts/analyze_permission_pairs_v2.py --check
      - run: python scripts/audit_grader_v3.py --check
      - run: python scripts/verify_week2.py --check
      - run: python scripts/verify_window_reopen.py
      - run: python scripts/verify_window_reopen_v2.py
      - run: python scripts/audit_attribution_boundaries.py --check
      - run: python scripts/audit_controlled_adapter.py --check
      - run: python scripts/audit_controlled_workbuddy.py --output reports/controlled-workbuddy.json --check
      - run: python scripts/verify_gui_controls.py
      - run: python scripts/ledger.py --check
      - run: python scripts/independent_check.py
      - run: python -m unittest discover -s tests -v
