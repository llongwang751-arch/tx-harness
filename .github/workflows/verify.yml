name: Verify evaluation kit

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m harness_eval audit
      - run: python scripts/verify_public_pilots.py
      - run: python scripts/analyze_evaluation_v2.py --check
      - run: python scripts/verify_contracts_v2.py --check
      - run: python scripts/analyze_permission_pairs_v2.py --check
      - run: python -m unittest discover -s tests -v
